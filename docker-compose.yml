services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    profiles: ["dev"]
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4321:4321"
    command: sh -c "npm install && rm -f .astro/dev.json && npm run dev -- --host 0.0.0.0 --port 4321"

  cms:
    profiles: ["dev"]
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      PORT: "8081"
      BIND_HOST: "0.0.0.0"
      ORIGIN: "http://localhost:4321"
      MODE: fs
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:8081:8081"
    command: sh -c "npm install && npx decap-server"
    depends_on:
      - dev

volumes:
  node_modules:
