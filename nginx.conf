server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self' https://api.netlify.com https://github.com; object-src 'none'; img-src 'self' data: https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://*.googletagmanager.com https://unpkg.com https://identity.netlify.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://*.googletagmanager.com https://*.netlify.com https://api.netlify.com https://identity.netlify.com https://github.com; frame-src https://www.google.com https://www.facebook.com https://www.instagram.com https://identity.netlify.com; frame-ancestors 'self'" always;

    location ~ /\. {
        deny all;
    }

    location = /galeria {
        return 301 /referencje/;
    }
    location /galeria/ {
        return 301 /referencje/;
    }
    location /nggallery/ {
        return 301 /referencje/;
    }
    location = /wp-login.php {
        return 301 /;
    }
    location /wp-admin {
        return 301 /;
    }
    location = /przykladowa-strona {
        return 301 /;
    }
    location /przykladowa-strona/ {
        return 301 /;
    }
    location = /feed {
        return 301 /aktualnosci/;
    }
    location = /feed/ {
        return 301 /aktualnosci/;
    }
    location = /comments/feed {
        return 301 /;
    }
    location = /comments/feed/ {
        return 301 /;
    }
    location = /zaufali-nam {
        return 301 /referencje/;
    }
    location /zaufali-nam/ {
        return 301 /referencje/;
    }
    location /polityka-plikow-cookies-eu {
        return 301 /cookies/;
    }
    location = /x-urodziny-dobrego-dzwieku {
        return 301 /aktualnosci/;
    }
    location /x-urodziny-dobrego-dzwieku/ {
        return 301 /aktualnosci/;
    }

    location = /oferta/imprezy-plenerowe-i-klubowe {
        return 301 /imprezy-plenerowe-i-klubowe/;
    }
    location = /oferta/imprezy-plenerowe-i-klubowe/ {
        return 301 /imprezy-plenerowe-i-klubowe/;
    }
    location = /oferta/targi-konferencje-eventy-firmowe {
        return 301 /targi-konferencje-eventy-firmowe/;
    }
    location = /oferta/targi-konferencje-eventy-firmowe/ {
        return 301 /targi-konferencje-eventy-firmowe/;
    }
    location = /oferta/konstrukcje-sceniczne {
        return 301 /konstrukcje-sceniczne/;
    }
    location = /oferta/konstrukcje-sceniczne/ {
        return 301 /konstrukcje-sceniczne/;
    }
    location = /oferta/rental-i-obsluga {
        return 301 /rental-i-obsluga/;
    }
    location = /oferta/rental-i-obsluga/ {
        return 301 /rental-i-obsluga/;
    }
    location = /oferta/oswietlenie-architektoniczne {
        return 301 /oswietlenie-architektoniczne/;
    }
    location = /oferta/oswietlenie-architektoniczne/ {
        return 301 /oswietlenie-architektoniczne/;
    }
    location = /oferta/moda-teatr-kabaret {
        return 301 /moda-teatr-kabaret/;
    }
    location = /oferta/moda-teatr-kabaret/ {
        return 301 /moda-teatr-kabaret/;
    }
    location = /oferta/imprezy-okolicznosciowe {
        return 301 /imprezy-okolicznosciowe/;
    }
    location = /oferta/imprezy-okolicznosciowe/ {
        return 301 /imprezy-okolicznosciowe/;
    }
    location = /oferta/instalacje-audio-video-av {
        return 301 /instalacje-audio-video-av/;
    }
    location = /oferta/instalacje-audio-video-av/ {
        return 301 /instalacje-audio-video-av/;
    }

    location = /portman-p3 {
        return 301 /aktualnosci/portman-p3/;
    }
    location = /portman-p3/ {
        return 301 /aktualnosci/portman-p3/;
    }
    location = /dom-dobrego-dzwieku {
        return 301 /aktualnosci/dom-dobrego-dzwieku/;
    }
    location = /dom-dobrego-dzwieku/ {
        return 301 /aktualnosci/dom-dobrego-dzwieku/;
    }

    location = /sitemap_index.xml {
        return 301 /sitemap-index.xml;
    }
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }
    location = /page-sitemap.xml {
        return 301 /sitemap-index.xml;
    }
    location = /post-sitemap.xml {
        return 301 /sitemap-index.xml;
    }
    location = /category-sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|webp|woff2|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
